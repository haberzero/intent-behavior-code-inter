[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibci-inter"
version = "0.2.0"
description = "IBC-Inter (Intent Behavior Code - Interactive): an experimental intent-driven hybrid programming language"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nan Shi" }]
keywords = ["language", "llm", "intent", "interpreter", "hybrid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
# pytest-timeout：每测试独立超时——卡死测试自动失败并定位（测试名 + 线程
# 栈），套件自身安全不依赖外部手动超时/捕获（conftest 进程级看门狗为
# 第二层兜底，见 tests/conftest.py 看门狗注释）。
test = ["pytest>=7", "pytest-timeout>=2"]
dev = ["pytest>=7", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ibci_modules*"]
