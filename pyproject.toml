[build-system]
# R4-2 pip 打包（架构 v2 用户点②）：maturin 构建 pyo3 扩展（Rust 内核）入 wheel
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "ibci-inter"
version = "0.2.0"
description = "IBC-Inter (Intent Behavior Code - Interactive): an experimental intent-driven hybrid programming language"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nan Shi" }]
keywords = ["language", "llm", "intent", "interpreter", "hybrid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
# pytest-timeout：每测试独立超时——卡死测试自动失败并定位（测试名 + 线程
# 栈），套件自身安全不依赖外部手动超时/捕获（conftest 进程级看门狗为
# 第二层兜底，见 tests/conftest.py 看门狗注释）。
test = ["pytest>=7", "pytest-timeout>=2"]
dev = ["pytest>=7", "pytest-timeout>=2"]

[tool.maturin]
# Rust 内核 pyo3 扩展（crate = ibci-ext，lib 名 ibci_ext——extension-module）
manifest-path = "ibci-ext/Cargo.toml"
module-name = "ibci_ext"
# Python 包（core/ + ibci_modules/）经 include 收录入 wheel（site-packages 根）
include = [
    "core/**/*.py",
    "core/**/*.json",
    "ibci_modules/**/*.py",
]
# 构建纪律（AGENTS.local.md）：cargo 写位置 pin workspace 内（默认不可写）
# 构建时经 env：CARGO_HOME=$PWD/.cargo_local CARGO_TARGET_DIR=$PWD/target
