[pytest]
testpaths = tests
addopts = -q --tb=short --strict-markers
# 每测试独立超时（pytest-timeout 插件）：单测试 60s 上限——卡死测试
# （线程 join 无界等待 / spawn collect 无界 / 死锁）自动 FAIL 并输出测试名
# + 全部线程栈（timeout_method=thread：faulthandler dump 后终止该测试）。
# 套件自身安全的第一层保障（不依赖外部手动超时/捕获）；tests/conftest.py
# 的进程级看门狗（180s）为第二层兜底（框架层 hang 才触发）。
# 全量 pytest 时长（~95s）不受影响——超时按测试计，非按套件计。
timeout = 60
timeout_method = thread
markers =
    slow: tests that are timing-sensitive or involve concurrency (may be flaky on CI)
    fast: pure unit tests with no I/O (< 200ms)
